# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "AdakHaddad"      # Your name
  discord:      ""      # Your discord username (optional)
  description:  "Tiny CPU + 8 hardware timers with NCO — run firmware to implement any protocol (UART/SPI/I2C/CAN/USB/custom) with cycle-accurate timing"  # One line description
  language:     "Verilog"
  clock_hz:     50000000       # Clock frequency in Hz (50 MHz)

  tiles: "8x4"          # 8x4 tiles

  top_module:  "tt_um_protocol_emu"

  source_files:
    - "tt_um_protocol_emu.v"
    - "../rtl/cpu_core.v"
    - "../rtl/timer_coproc.v"
    - "../rtl/pin_matrix.v"
    - "../rtl/prog_mem.v"
    - "../rtl/host_if.v"
    - "../rtl/capture_buf.v"

pinout:
  # Inputs - 8 bidirectional protocol pins (UI)
  ui[0]: "PIN0"   # Protocol pin 0
  ui[1]: "PIN1"   # Protocol pin 1
  ui[2]: "PIN2"   # Protocol pin 2
  ui[3]: "PIN3"   # Protocol pin 3
  ui[4]: "PIN4"   # Protocol pin 4
  ui[5]: "PIN5"   # Protocol pin 5
  ui[6]: "PIN6"   # Protocol pin 6
  ui[7]: "PIN7"   # Protocol pin 7

  # Outputs - Pin outputs when driven (UO)
  uo[0]: "PIN0_OUT"
  uo[1]: "PIN1_OUT"
  uo[2]: "PIN2_OUT"
  uo[3]: "PIN3_OUT"
  uo[4]: "PIN4_OUT"
  uo[5]: "PIN5_OUT"
  uo[6]: "PIN6_OUT"
  uo[7]: "PIN7_OUT"

  # Bidirectional - Host SPI + status (UIO)
  uio[0]: "SPI_SCK"        # In: Host SPI clock
  uio[1]: "SPI_MOSI"       # In: Host SPI data in
  uio[2]: "SPI_CS_N"       # In: Host SPI chip select (active low)
  uio[3]: "SPI_MISO"       # Out: Host SPI data out
  uio[4]: "STATUS_RUN"     # Out: CPU running
  uio[5]: "STATUS_ERR"     # Out: CPU error/fault
  uio[6]: "CAPTURE_RDY"    # Out: Capture buffer ready
  uio[7]: "RESERVED"       # Reserved

yaml_version: 6
